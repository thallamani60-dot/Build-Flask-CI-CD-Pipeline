name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: LINT · Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run Flake8
        run: python -m flake8 app tests wsgi.py

  test:
    name: TEST · Pytest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  build:
    name: BUILD · Wheel and source archive
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Build wheel and source archive
        run: python -m build --sdist --wheel --outdir dist
      - name: Upload distribution files
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  deploy:
    name: DEPLOY · Render
    needs: [lint, test, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is missing. Add it in the repository Actions secrets settings."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --max-time 30 --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render accepted the deployment request. Check the Render Deploys page for build and health-check completion."

  summary:
    name: Workflow summary
    if: ${{ always() }}
    needs: [lint, test, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## CI/CD workflow summary"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Test | $TEST_RESULT |"
            echo "| Build | $BUILD_RESULT |"
            echo "| Deploy | $DEPLOY_RESULT |"
            echo
            echo "**Trigger:** $EVENT_NAME on \`$BRANCH_NAME\`"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo
              echo "Deployment is skipped for pull requests."
            elif [ "$DEPLOY_RESULT" = "success" ]; then
              echo
              echo "The deploy hook accepted the request. Confirm the Render deployment and health check in the Render dashboard."
            elif [ "$DEPLOY_RESULT" = "failure" ]; then
              echo
              echo "Deployment did not start successfully. Check the deploy job log and the RENDER_DEPLOY_HOOK_URL repository secret."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
