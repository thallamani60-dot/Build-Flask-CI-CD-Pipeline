
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: LINT · Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run Flake8
        run: python -m flake8 app tests wsgi.py

  test:
    name: TEST · Pytest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build:
    name: BUILD · Wheel and source archive
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Build wheel and source archive
        run: python -m build --sdist --wheel --outdir dist

      - name: Upload distribution files
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  deploy:
    name: DEPLOY · Vercel
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Check Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo "::error::Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "::error::Missing VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "::error::Missing VERCEL_PROJECT_ID" && exit 1)

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel project
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  summary:
    name: Workflow summary
    if: always()
    needs: [lint, test, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## CI/CD workflow summary"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Test | $TEST_RESULT |"
            echo "| Build | $BUILD_RESULT |"
            echo "| Deploy | $DEPLOY_RESULT |"
            echo
            echo "**Trigger:** $EVENT_NAME on \`$BRANCH_NAME\`"

            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo
              echo "Deployment is skipped for pull requests."
            elif [ "$DEPLOY_RESULT" = "success" ]; then
              echo
              echo "Vercel production deployment completed. Verify the deployment in the Vercel dashboard."
            elif [ "$DEPLOY_RESULT" = "failure" ]; then
              echo
              echo "Vercel deployment failed. Check the deployment logs and Vercel repository secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

