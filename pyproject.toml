[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-cd-pipeline-secrets-management"
version = "1.0.0"
description = "A Flask application demonstrating a secure GitHub Actions CI/CD pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.0,<4.0",
    "gunicorn>=22.0,<24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
